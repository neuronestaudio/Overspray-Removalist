<!doctype html>
<html lang="en-AU">
  <head>
    <!-- Google Tag Manager -->
    <!-- REPLACE GTM-XXXXXXX with the client's container ID, here and in src/lib/site.ts.
         Inlined rather than injected so the container loads before React boots. -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    <!-- End Google Tag Manager -->


    <!-- Splash gate. Runs before the body paints, so there is never a flash of
         page followed by a splash slapped over the top. Sets the attribute only
         when the splash should actually play; no script or no JS means no
         attribute, which means no overlay for a crawler or a no-JS visitor. -->
    <script>
    (function () {
      try {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (path !== '/') return;
        if (sessionStorage.getItem('osr_splash') === 'seen') return;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        sessionStorage.setItem('osr_splash', 'seen');
        document.documentElement.setAttribute('data-splash', 'armed');
      } catch (e) {
        /* private mode, blocked storage: simply do not play it */
      }
    })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b16" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <title>Overspray Removal Australia | The Overspray Removalist</title>
    <meta
      name="description"
      content="Specialist paint overspray, cement splatter, graffiti and industrial fallout removal from vehicles, fleets and property. Over 30 years, non-abrasive, Australia wide."
    />
    <link rel="canonical" href="https://oversprayremovalists.com.au/" />

    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/bebas-neue-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/dm-sans-400.woff2" crossorigin />

    <!-- Sitewide business schema. Per-page Service / Breadcrumb schema is added by PageMeta. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoRepair",
      "@id": "https://oversprayremovalists.com.au/#business",
      "name": "The Overspray Removalist",
      "description": "Specialist removal of paint overspray, cement splatter, graffiti and industrial fallout from vehicles, fleets, boats, aircraft and buildings. Over 30 years experience.",
      "url": "https://oversprayremovalists.com.au",
      "telephone": "+61412107464",
      "email": "info@overspray.com.au",
      "image": "https://oversprayremovalists.com.au/assets/images/job-splatter-2-677.webp",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Epping",
        "addressRegion": "VIC",
        "postalCode": "3076",
        "addressCountry": "AU"
      },
      "areaServed": { "@type": "Country", "name": "Australia" },
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
        "opens": "08:00",
        "closes": "17:00"
      }]
    }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!-- Landing splash. Inert unless html[data-splash] is set above. -->
    <div class="splash" role="presentation">
      <div class="splash-inner">
        <img
          class="splash-logo"
          src="/assets/images/logo.webp"
          alt=""
          width="900"
          height="485"
          fetchpriority="high"
        />
        <span class="splash-rule"></span>
        <span class="splash-tag">Thirty years, Australia wide</span>
      </div>
      <button class="splash-skip" type="button" data-splash-skip>Skip</button>
    </div>

    <div id="root"></div>
    <script>
    (function () {
      var html = document.documentElement;
      if (html.getAttribute('data-splash') !== 'armed') return;
      var splash = document.querySelector('.splash');
      if (!splash) { html.removeAttribute('data-splash'); return; }

      var timers = [];
      function clear() { timers.forEach(clearTimeout); timers = []; }

      function dismiss() {
        if (html.getAttribute('data-splash') === 'out') return;
        clear();
        html.setAttribute('data-splash', 'out');
        // Take it out of the tree once the wipe has finished.
        timers.push(setTimeout(function () {
          html.removeAttribute('data-splash');
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 1100));
      }

      // Start the reveal on the next frame so the transitions have a from-state.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { html.setAttribute('data-splash', 'run'); });
      });

      timers.push(setTimeout(dismiss, 2300));

      var skip = splash.querySelector('[data-splash-skip]');
      if (skip) skip.addEventListener('click', dismiss);
      splash.addEventListener('click', dismiss);
      window.addEventListener('keydown', dismiss, { once: true });
      window.addEventListener('wheel', dismiss, { once: true, passive: true });
      window.addEventListener('touchstart', dismiss, { once: true, passive: true });
    })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
